[project]
name = "gym-management-backend"
version = "1.0.0"
description = "Async FastAPI backend for the gym management system MVP."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.2,<2.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    "email-validator>=2.2.0,<3.0.0",
    "fastapi>=0.111.0,<1.0.0",
    "bcrypt>=3.2.0,<4.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "pydantic-settings>=2.3.4,<3.0.0",
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "sqlalchemy>=2.0.31,<3.0.0",
    "structlog>=24.2.0,<25.0.0",
    "uvicorn[standard]>=0.30.1,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.4.2,<25.0.0",
    "httpx>=0.27.0,<1.0.0",
    "mypy>=1.10.1,<2.0.0",
    "pre-commit>=3.7.1,<4.0.0",
    "pytest>=8.2.2,<9.0.0",
    "pytest-asyncio>=0.23.7,<1.0.0",
    "ruff>=0.5.1,<1.0.0",
]

[tool.setuptools]
packages = ["app"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "ANN"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["jose.*", "passlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["app/tests"]
