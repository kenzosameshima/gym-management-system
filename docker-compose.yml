services:
  postgres:
    image: postgres:16-alpine
    container_name: gym-management-postgres
    environment:
      POSTGRES_DB: gym_management
      POSTGRES_USER: gym_user
      POSTGRES_PASSWORD: gym_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym_user -d gym_management"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gym-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gym-management-backend
    env_file:
      - ./backend/.env.example
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gym-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: gym-management-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gym-network

  frontend-dev:
    image: node:20-alpine
    container_name: gym-management-frontend-dev
    working_dir: /app
    profiles:
      - dev
    env_file:
      - ./frontend/.env.example
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gym-network

volumes:
  postgres_data:
  frontend_node_modules:

networks:
  gym-network:
    driver: bridge
